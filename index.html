<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieManiaLK Video Player Demo</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--red:#f5222d;--white:#fff}
body{margin:0;min-height:100vh;background:#090909;color:var(--white);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:18px}
.player{width:min(100%,1100px);aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:clamp(18px,4vw,48px);background:#111;box-shadow:0 0 35px #9d171b35;border:1px solid #321719;isolation:isolate}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.67);background:radial-gradient(ellipse at center,#384333,#111)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0003 0%,transparent 35%,transparent 58%,#000b 100%);pointer-events:none}
.unlock{position:absolute;left:3%;top:43%;width:clamp(44px,9vw,100px);height:clamp(44px,9vw,100px);border-radius:50%;display:grid;place-items:center;background:#0009;color:#fff;border:0;cursor:pointer}
.unlock svg{width:42%;height:42%}
.center-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(76px,17vw,176px);height:clamp(76px,17vw,176px);border-radius:50%;border:0;background:#ffffffd9;color:#151515;display:grid;place-items:center;cursor:pointer;transition:transform .18s,background .18s}
.center-play:hover{transform:translate(-50%,-50%) scale(1.04);background:#fff}
.center-play svg{width:42%;height:42%;margin-left:7px}
.progress-area{position:absolute;left:2%;right:2%;bottom:20%;height:12px;display:flex;align-items:center;cursor:pointer}
.track{height:5px;width:100%;background:#ffffff70;border-radius:99px;position:relative}
.knob{position:absolute;left:0;top:50%;transform:translate(-25%,-50%);width:clamp(19px,4vw,42px);height:clamp(19px,4vw,42px);border-radius:50%;background:var(--red);box-shadow:0 0 8px #f5222d55}
.controls{position:absolute;left:3%;right:3%;bottom:3%;display:flex;align-items:center;gap:clamp(10px,2.7vw,34px)}
.control{padding:0;border:0;background:transparent;color:white;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.control svg{width:clamp(23px,4.5vw,48px);height:clamp(23px,4.5vw,48px);fill:currentColor}
.time{font-size:clamp(12px,2.6vw,30px);white-space:nowrap;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.vlc{width:clamp(44px,7.5vw,80px);height:clamp(44px,7.5vw,80px);border-radius:50%;background:#ffffff12}
.vlc svg{width:58%;height:58%}
.notice{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:clamp(9px,1.5vw,13px);color:#fff9;background:#0008;border:1px solid #ffffff18;border-radius:999px;padding:7px 12px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:8}
.notice.show{opacity:1}
.settings-menu{display:none;position:absolute;z-index:6;right:3%;bottom:15%;width:min(62%,440px);max-height:74%;overflow-y:auto;background:rgba(12,15,18,.96);backdrop-filter:blur(18px);border:1px solid #ffffff18;border-radius:10px;box-shadow:0 12px 35px #0009;padding:8px 0;color:#fff}
.settings-menu.open{display:block}
.settings-heading{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;color:#aeb3bd;font-size:10px;letter-spacing:1.3px;border-bottom:1px solid #ffffff12}
.settings-heading button{background:transparent;border:0;color:#fff;font-size:24px;cursor:pointer}
.setting-row{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;align-items:center;gap:8px;min-height:43px;padding:8px 12px;border-bottom:1px solid #ffffff08;font-size:clamp(11px,1.8vw,15px)}
.setting-row select{max-width:115px;width:100%;background:#20242b;color:#d8dbe2;border:1px solid #363b45;border-radius:6px;padding:6px 5px;font-size:clamp(10px,1.6vw,13px)}
.setting-row b{font-size:22px;font-weight:400}
.setting-row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.settings-menu{width:74%;right:2%;bottom:17%;max-height:76%}.setting-row{min-height:39px;padding:6px 9px}.setting-row select{max-width:90px}}
@media(max-width:520px){body{padding:10px}.player{border-radius:22px}.controls{gap:clamp(8px,2vw,14px);bottom:5%}.progress-area{bottom:23%}.time{font-size:clamp(10px,2.5vw,13px)}.vlc{width:34px;height:34px}}
</style>
</head>
<body>
<div class="player" id="player">
  <img class="poster" alt="Movie poster background" src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1600&q=85">
  <div class="shade"></div>
  <div class="notice" id="notice">Player UI demo — video source not connected</div>
  <button class="unlock" aria-label="Access options" onclick="message('Access options')">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2ZM9 6a3 3 0 0 1 6 0v2H9Z"/></svg>
  </button>
  <button class="center-play" aria-label="Play video" onclick="message('Add a video URL to enable playback')">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8c0-1.2 1.3-1.9 2.3-1.2l11.2 7.2a1.5 1.5 0 0 1 0 2.5L9.3 20.5A1.5 1.5 0 0 1 7 19.2Z"/></svg>
  </button>
  <div class="progress-area" onclick="message('Progress bar preview — connect a video source for seeking')"><div class="track"><div class="knob"></div></div></div>
  <div class="settings-menu" id="settingsMenu" aria-label="Player settings">
    <div class="settings-heading">PLAYER SETTINGS <button onclick="toggleSettings()" aria-label="Close settings">×</button></div>
    <div class="setting-row"><span>◴　Play Speed</span><select id="speedSetting" onchange="setSetting('speed',this.value)"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>Normal (1x)</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><b>›</b></div>
    <div class="setting-row"><span>◧　Aspect Ratio</span><select id="ratioSetting" onchange="setSetting('ratio',this.value)"><option value="default" selected>Default</option><option value="16/9">16:9</option><option value="4/3">4:3</option><option value="fill">Fit to Screen</option></select><b>›</b></div>
    <div class="setting-row"><span>◈　Video Flip</span><select id="flipSetting" onchange="setSetting('flip',this.value)"><option value="normal" selected>Normal</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select><b>›</b></div>
    <div class="setting-row"><span>▰　Subtitle</span><select id="subtitleSetting" onchange="setSetting('subtitle',this.value)"><option value="Sinhala" selected>Sinhala</option><option value="English">English</option><option value="off">Off</option></select><b>›</b></div>
    <div class="setting-row"><span>◉　Sub Sync (Delay)</span><select id="syncSetting" onchange="setSetting('sync',this.value)"><option value="0" selected>0 ms</option><option value="-500">-500 ms</option><option value="-250">-250 ms</option><option value="250">+250 ms</option><option value="500">+500 ms</option><option value="1000">+1000 ms</option></select><b>›</b></div>
    <div class="setting-row"><span>☷　Sub Size</span><select id="sizeSetting" onchange="setSetting('size',this.value)"><option value="small">Small</option><option value="medium" selected>Medium</option><option value="large">Large</option><option value="xlarge">Extra Large</option></select><b>›</b></div>
    <div class="setting-row"><span>☷　Sub Pos</span><select id="posSetting" onchange="setSetting('pos',this.value)"><option value="bottom" selected>Bottom</option><option value="middle">Middle</option><option value="top">Top</option></select><b>›</b></div>
  </div>
  <div class="controls">
    <button class="control" aria-label="Play" onclick="message('Video source not connected')" >
      <svg viewBox="0 0 24 24"><path d="M6 3.8c0-1.1 1.2-1.8 2.2-1.2l13 7.5a2.2 2.2 0 0 1 0 3.8l-13 7.5A1.5 1.5 0 0 1 6 20.1Z"/></svg>
    </button>
    <button class="control" aria-label="Volume" onclick="message('Volume control demo')">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9Zm12.5 3a3.5 3.5 0 0 0-2-3.16v6.31a3.5 3.5 0 0 0 2-3.15Zm-2-8.7v2.06a7 7 0 0 1 0 13.28v2.06a9 9 0 0 0 0-17.4Z"/></svg>
    </button>
    <div class="time">00:00 / 01:30:53</div>
    <div class="spacer"></div>
    <button class="control vlc" aria-label="External player" onclick="message('External player requires a direct video URL')">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff8c27" d="M12 1 23 21H1Z"/><path fill="#fff" d="M12 6 18.5 18H5.5Z"/><path fill="#ff8c27" d="M12 10 15 16H9Z"/></svg>
    </button>
    <button class="control" aria-label="Settings" onclick="toggleSettings()" aria-expanded="false" id="settingsButton">
      <svg viewBox="0 0 24 24"><path d="m19.4 13.5 1.5 1.2-1.5 2.6-1.8-.7a7.7 7.7 0 0 1-1.8 1l-.3 1.9h-3l-.4-1.9a7.7 7.7 0 0 1-1.8-1l-1.8.7L7 14.7l1.5-1.2a7 7 0 0 1 0-2L7 10.3l1.5-2.6 1.8.7a7.7 7.7 0 0 1 1.8-1l.4-1.9h3l.3 1.9a7.7 7.7 0 0 1 1.8 1l1.8-.7 1.5 2.6-1.5 1.2a7 7 0 0 1 0 2ZM14 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/></svg>
    </button>
    <button class="control" aria-label="Fullscreen" onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v3H6v4H3zm11 0h7v7h-3V6h-4zM3 14h3v4h4v3H3zm15 0h3v7h-7v-3h4z"/></svg>
    </button>
  </div>
</div>
<script>
let noticeTimer;
function message(text){
  const el=document.getElementById('notice');
  el.textContent=text;
  el.classList.add('show');
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>el.classList.remove('show'),2200);
}
function toggleFullscreen(){
  const p=document.getElementById('player');
  if(!document.fullscreenElement && p.requestFullscreen){p.requestFullscreen().catch(()=>message('Fullscreen not available in this browser'));}
  else if(document.exitFullscreen){document.exitFullscreen();}
}
function toggleSettings(){
  const menu=document.getElementById('settingsMenu');
  const button=document.getElementById('settingsButton');
  const open=!menu.classList.contains('open');
  menu.classList.toggle('open',open);
  button.setAttribute('aria-expanded',String(open));
}
function setSetting(name,value){
  if(name==='speed') message('Play speed selected: '+value+'x (connect video source to apply)');
  else if(name==='ratio'){
    const p=document.getElementById('player');
    if(value==='default') p.style.aspectRatio='16/9';
    else if(value==='fill') p.style.aspectRatio='auto';
    else p.style.aspectRatio=value;
    message('Aspect ratio: '+(value==='fill'?'Fit to Screen':value));
  }else if(name==='flip'){
    const poster=document.querySelector('.poster');
    poster.style.transform=value==='horizontal'?'scaleX(-1)':value==='vertical'?'scaleY(-1)':'none';
    message('Video flip: '+value);
  }else if(name==='subtitle') message('Subtitle: '+(value==='off'?'Off':value));
  else if(name==='sync') message('Subtitle delay: '+value+' ms');
  else if(name==='size') message('Subtitle size: '+value);
  else if(name==='pos') message('Subtitle position: '+value);
}
</script>
</body>
</html>
