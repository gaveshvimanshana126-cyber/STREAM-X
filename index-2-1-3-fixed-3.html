/* ===== Live data from Firebase (falls back to the demo list above if empty/offline) ===== */
const FIREBASE_DB_URL='https://gaveesha-edfdb-default-rtdb.firebaseio.com';
function hashHue(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h}
let M=DEMO_M.slice();
async function loadMovies(){
  try{
    const res=await fetch(`${FIREBASE_DB_URL}/subtitles.json`);
    const data=await res.json();
    if(data&&typeof data==='object'){
      const arr=Object.keys(data).map(id=>{
        const v=data[id]||{};
        return {
          id, t:v.t||'Untitled', y:v.y||'', k:v.k||'Movie', g:v.g||'',
          r:Number(v.r)||0, h:Number.isFinite(v.h)?v.h:hashHue(id), dl:Number(v.dl)||0,
          v:v.v||'', s:v.s||'', d:v.d||'', subBy:v.subBy||'MovieManiaLK team',
          subUrl:v.subUrl||'', backdrop:v.backdrop||'', poster:v.poster||'',
          lang:v.lang||'English', runtime:v.runtime||'', tagline:v.tagline||'',
        };
      });
      if(arr.length)M=arr;
    }
  }catch(e){console.warn('Firebase load failed, showing demo data',e);}
}
function bumpDownload(id){
  const m=M.find(x=>x.id===id);if(!m)return;
  m.dl=(m.dl||0)+1;
  const el=document.getElementById('dlCount');
  if(el)el.textContent=`${m.dl.toLocaleString('en-US')} Downloads`;
  // Best-effort: keep the Firebase counter in sync (fails silently offline / if rules block writes)
  fetch(`${FIREBASE_DB_URL}/subtitles/${id}/dl.json`,{method:'PUT',body:JSON.stringify(m.dl)}).catch(()=>{});
}

 trending:['Trending now',()=>by((a,b)=>b.r-a.r).slice(0,6)],

function lists(){
  const el=$('#lists');if(!el)return;
  if(query){
    const q=query.toLowerCase();
    const res=M.filter(m=>(!q||m.t.toLowerCase().includes(q)));
    el.innerHTML=res.length?row('Results',res):`<div class="wrap empty">No subtitles found. Try a different title.</div>`;
  }else{
    el.innerHTML=['trending','latest','series'].map(k=>k==='trending'?trendRow(k,SECTIONS[k][1]()):row(k,SECTIONS[k][1]())).join('');
  }
}
function carousel(){
  const sl=$('#slides');if(!sl)return;
  const dots=[...document.querySelectorAll('#dots button')],n=dots.length;
  const step=()=>sl.children[1].offsetLeft-sl.children[0].offsetLeft;
  let cur=0;
  const mark=i=>{cur=i;dots.forEach((d,k)=>d.classList.toggle('on',k===i))};
  const go=i=>sl.scrollTo({left:i*step(),behavior:'smooth'});
  dots.forEach((d,i)=>d.onclick=()=>{clearInterval(timer);go(i)});
  sl.addEventListener('scroll',()=>mark(Math.min(n-1,Math.max(0,Math.round(sl.scrollLeft/step())))),{passive:true});
  mark(0);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  timer=setInterval(()=>go((cur+1)%n),5000);
  ['pointerdown','focusin'].forEach(ev=>sl.addEventListener(ev,()=>clearInterval(timer),{once:true}));
}
function section(key){

}

const NAMES=['Mira Chen','Daniel Okafor','Aiko Tanaka','Lucas Ferreira','Sara Holt','Ravi Menon'];
const ROLES=['Lead role','Detective Hale','Dr. Imani','Captain Reyes','Nora','The Stranger'];
const TAGS=['Nothing stays buried.','Every door has a price.','Some stories choose you.'];
async function getInfo(m){
  // Prefer the backdrop the admin picked from TMDB and saved in Firebase; fall back to a live search.
  let backdrop = m.backdrop || '';
  if(!backdrop){
    try {
      const type = m.k==='Series' ? 'tv' : 'movie';
      const res = await fetch(`https://api.themoviedb.org/3/search/${type}?query=${encodeURIComponent(m.t)}&year=${m.y}&api_key=62970b022a0cfd34d9afa28c131be97b`);
      const data = await res.json();
      const hit = (data.results||[])[0];
      if(hit?.backdrop_path) backdrop = 'https://image.tmdb.org/t/p/w1280' + hit.backdrop_path;
    } catch(e){}
  }
  return{backdrop, tagline:m.tagline||TAGS[m.h%3],
    runtime:m.runtime||(m.k==='Series'?'1 season':(95+m.h%45)+' min'),
    lang:m.lang||'English',director:NAMES[(m.h+2)%6],votes:Math.round(m.dl/4).toLocaleString('en-US'),
    cast:ROLES.map((c,i)=>({n:NAMES[(i+m.h)%6],c}))};
}

function page(title,text){

let curHash=location.hash;
function nav(h){
  if(curHash===h)return route(h);
  try{history.pushState(null,'',h)}catch(_){try{location.hash=h}catch(__){}}
  route(h);
}
function route(h){
  curHash=h===undefined?location.hash:h;
  clearInterval(timer);
  const [, a, b]=curHash.split('/');
  window.scrollTo(0,0);
  $('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');
  if(a==='movie')movie(b);
  else if(a==='download')download(b);
  else if(a==='section')section(b);
  else if(a==='about')page('About','MovieManiaLKSub shares Sinhala subtitle files for movies and TV series. Edit this text to describe your team.');
  else if(a==='contact')page('Contact','Add your email or social links here.');
  else if(a==='privacy')page('Privacy','Add your privacy policy here.');
  else home();
}
const sp=$('#sp'),q=$('#q');
function clearSearch(){q.value='';query='';lists()}
$('#sBtn').onclick=()=>{const o=sp.classList.toggle('open');$('#sBtn').setAttribute('aria-expanded',o);if(o)q.focus();else clearSearch()};
q.oninput=()=>{query=q.value.trim();if(curHash&&curHash!=='#/')nav('#/');else lists()};
q.onkeydown=e=>{if(e.key==='Escape')$('#sBtn').click()};
$('#sf').onsubmit=e=>{e.preventDefault();const l=$('#lists');if(l)l.scrollIntoView()};
$('#menuBtn').onclick=e=>{const o=$('#nav').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#/"]');
  if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();nav(a.getAttribute('href'));
});
['hashchange','popstate'].forEach(ev=>addEventListener(ev,()=>{if(location.hash!==curHash)route(location.hash)}));
loadMovies().then(route);
